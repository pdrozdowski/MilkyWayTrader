name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (production requires main)
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

# One production run at a time; each PR has its own preview queue.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && 'staging' || 'production') }}
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Validate production build
        run: npm run validate:deployment

      - name: Select deployment target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          MANUAL_TARGET: ${{ inputs.target }}
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_HEAD_REPOSITORY" == "$REPOSITORY" ]]; then
              echo "branch=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
            else
              echo "Fork PR: validation only; deployment credentials are not used." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_TARGET" == "staging" ]]; then
            echo "branch=staging" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" == "refs/heads/main" ]]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "Production deployments require main." >&2
            exit 1
          fi

      - name: Publish to Cloudflare Pages
        if: steps.target.outputs.branch != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ steps.target.outputs.branch }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Configure CLOUDFLARE_API_TOKEN in Actions Secrets and CLOUDFLARE_ACCOUNT_ID in Actions Variables." >&2
            exit 1
          fi
          npx --no-install wrangler pages deploy dist \
            --project-name=milky-way-trader \
            --branch="$DEPLOY_BRANCH" \
            --commit-hash="$COMMIT_SHA" \
            --commit-dirty=false
          echo "Published branch: $DEPLOY_BRANCH; commit: $COMMIT_SHA. See Wrangler output for the deployment URL." >> "$GITHUB_STEP_SUMMARY"
