<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="/style.css">
    <title>Phaser - Template</title>
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
        <section id="main-menu" data-game-input="ignore" aria-label="Main menu" hidden>
            <img id="main-menu-logo" src="/assets/logo.png" alt="MilkyWayTrader" />
            <div id="main-menu-controls">
                <button id="main-menu-new-game" class="action-button" type="button">New Game</button>
                <button id="main-menu-continue" class="action-button" type="button" disabled>Continue Game</button>
                <button id="main-menu-sign-in" class="action-button" type="button" data-game-input="ignore">Sign in with Google</button>
                <button id="main-menu-fullscreen" class="action-button" type="button" aria-pressed="false">Fullscreen Mode: OFF</button>
            </div>
        </section>
        <section id="run-status" data-game-input="ignore" aria-label="Run status" hidden>
            <div id="run-status-left">
                <button id="game-menu-toggle" type="button" aria-expanded="false" aria-controls="game-menu">Menu</button>
                <span id="run-status-clock"></span>
                <span id="run-status-auth" aria-live="polite"></span>
            </div>
            <div id="run-status-primary"><label id="run-status-hp-label" for="run-status-hp"></label><progress id="run-status-hp" value="0" max="100"></progress></div>
            <div id="run-status-secondary"><span id="run-status-credits"></span><span id="run-status-cargo"></span><button id="run-status-ship-toggle" type="button" aria-expanded="false" aria-controls="run-status-ship-details">Ship info</button><button id="run-status-cargo-toggle" type="button" aria-expanded="false" aria-controls="run-status-cargo-details">Cargo info</button><section id="run-status-ship-details" aria-label="Ship information" hidden><p id="run-status-cargo-system"></p><p id="run-status-engine-system"></p><p id="run-status-weapon-system"></p><p id="run-status-booster"></p></section><section id="run-status-cargo-details" aria-label="Cargo contents" hidden><p id="run-status-cargo-contents"></p><table id="run-status-cargo-table" aria-label="Cargo stock table"><thead><tr><th scope="col">Icon</th><th scope="col">Commodity</th><th scope="col">Stock</th></tr></thead><tbody id="run-status-cargo-rows"></tbody></table></section></div>
        </section>
        <section id="game-menu" data-game-input="ignore" aria-label="Game menu" aria-modal="true" role="dialog" hidden>
            <div class="game-menu-panel">
                <button id="game-menu-close" type="button" aria-label="Close menu">X</button>
                <h2>Menu</h2>
                <div class="game-menu-actions">
                <button id="game-menu-resume" class="action-button" type="button">Resume</button>
                <button id="game-menu-sign-out" class="action-button" type="button" data-game-input="ignore" hidden>Sign out</button>
                <div id="audio-controls" role="group" aria-label="Game audio">
                    <button id="audio-mute" type="button" aria-pressed="false">Mute</button>
                    <label for="audio-volume">Volume</label>
                    <input id="audio-volume" type="range" min="0" max="100" step="1" value="50" />
                    <output id="audio-volume-value" for="audio-volume">50%</output>
                </div>
                <div id="menu-display-controls" hidden>
                    <button id="menu-fullscreen-toggle" type="button" aria-pressed="false">Fullscreen</button>
                    <p id="menu-display-status" role="status" aria-live="polite"></p>
                </div>
                <button id="return-to-menu" class="action-button" type="button">Return to Main Menu</button>
                </div>
            </div>
        </section>
        <section id="debug-menu" data-game-input="ignore" aria-label="Debug menu" aria-modal="true" role="dialog" hidden>
            <div class="game-menu-panel debug-menu-panel">
                <button id="debug-menu-close" type="button" aria-label="Close debug menu">X</button>
                <h2>Debug</h2>
                <button id="debug-touch-controls-toggle" type="button" aria-pressed="false"></button>
                <button id="debug-mouse-movement-toggle" type="button" aria-pressed="true"></button>
                <button id="debug-booster-toggle" type="button" aria-pressed="false"></button>
            </div>
        </section>
        <section id="landing-status" data-game-input="ignore" aria-label="Landed status" aria-modal="true" role="dialog" hidden>
            <div class="landing-status-panel">
                <section id="landing-status-hub" class="landing-view">
                    <div class="landing-visual"><div class="landing-title-stack"><img id="landing-status-title" src="" alt="" /><img id="landing-status-landed" src="/assets/banner_landed_01.png" alt="LANDED" /></div></div>
                    <nav class="landing-actions" aria-label="Planet services"><button id="landing-status-market" class="landing-image-button" type="button" aria-label="Market"><img src="/assets/button_market.png" alt="" /></button><button id="landing-status-shipyard" class="landing-image-button" type="button" aria-label="Shipyard unavailable" disabled><img src="/assets/button_shipyard.png" alt="" /></button><button id="landing-status-launch" class="landing-image-button landing-launch" type="button" aria-label="Launch"><img src="/assets/button_launch.png" alt="" /></button></nav>
                </section>
                <section id="landing-status-market-view" class="landing-view" hidden>
                <header class="landing-market-header"><h2 id="landing-status-market-heading"></h2><div id="landing-status-balances"><span id="landing-status-credits"></span><span id="landing-status-cargo"></span></div></header>
                <div id="landing-status-catalogue" role="group" aria-label="Seroton commodities">
                    <button type="button" data-commodity-id="supplies"></button>
                    <button type="button" data-commodity-id="alloys"></button>
                    <button type="button" data-commodity-id="medicines"></button>
                </div>
                <section id="landing-status-trade" aria-label="Trade preview">
                    <section class="market-inventory-panel" aria-label="Planet stock"><strong id="landing-status-commodity-name"></strong><p id="landing-status-planet-stock"></p><p id="landing-status-production"></p><p id="landing-status-consumption"></p><p id="landing-status-supply"></p></section>
                    <section class="market-trade-control"><header class="market-trade-header"><div><strong id="landing-status-quantity-label"></strong><p id="landing-status-unit-price"></p></div><span class="market-commodity-icon" role="img"></span></header><input id="landing-status-quantity" type="range" step="1" value="0" /><output id="landing-status-quantity-value" for="landing-status-quantity"></output><p id="landing-status-quote"></p><p id="landing-status-budget" role="status"></p><button id="landing-status-confirm" type="button"></button></section>
                    <section class="market-inventory-panel" aria-label="Ship inventory"><strong>Ship stock</strong><p id="landing-status-player-stock"></p><p id="landing-status-average-buy-price"></p><p id="landing-status-trade-result-label"></p><p id="landing-status-trade-result"></p></section>
                </section>
                <button id="landing-status-back" class="action-button" type="button"></button>
                </section>
            </div>
        </section>
        <aside id="orientation-notice" data-game-input="ignore" aria-label="Screen orientation" aria-modal="true" role="dialog" hidden>
            <div>
                <span class="rotate-icon" aria-hidden="true">↻</span>
                <h1>Rotate your phone</h1>
                <p id="orientation-help">To PLAY rotate your device.</p>
                <div id="mobile-controls" data-game-input="ignore">
                    <button id="fullscreen-toggle" type="button" aria-pressed="false">Fullscreen</button>
                    <p id="display-status" role="status" aria-live="polite"></p>
                </div>
            </div>
        </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
