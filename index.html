<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="/style.css">
    <title>Phaser - Template</title>
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
        <section id="run-status" data-game-input="ignore" aria-label="Run status" hidden>
            <span id="run-status-clock"></span>
            <button id="run-status-ship-toggle" type="button" aria-expanded="false" aria-controls="run-status-ship-details">Ship info</button>
            <div id="run-status-primary"><span id="run-status-credits"></span><span id="run-status-cargo"></span><label id="run-status-hp-label" for="run-status-hp"></label><progress id="run-status-hp" value="0" max="100"></progress></div>
            <button id="run-status-cargo-toggle" type="button" aria-expanded="false" aria-controls="run-status-cargo-details">Cargo</button>
            <section id="run-status-ship-details" aria-label="Ship information" hidden><p id="run-status-cargo-system"></p><p id="run-status-engine-system"></p><p id="run-status-weapon-system"></p><p id="run-status-booster"></p></section>
            <section id="run-status-cargo-details" aria-label="Cargo contents" hidden><p id="run-status-cargo-contents"></p></section>
        </section>
        <aside id="orientation-notice" aria-label="Orientacja ekranu" hidden>
            <div>
                <span class="rotate-icon" aria-hidden="true">↻</span>
                <h1>Obróć telefon</h1>
                <p>MilkyWayTrader — gramy w poziomie.</p>
                <p id="orientation-help">Obróć urządzenie lub wybierz „Pełny ekran”.</p>
            </div>
        </aside>
        <div id="mobile-controls" data-game-input="ignore" hidden>
            <button id="fullscreen-toggle" type="button" aria-pressed="false">Pełny ekran</button>
            <p id="display-status" role="status" aria-live="polite"></p>
        </div>
        <div id="audio-controls" data-game-input="ignore" role="group" aria-label="Game audio">
            <button id="audio-mute" type="button" aria-pressed="false">Mute</button>
            <label for="audio-volume">Volume</label>
            <input id="audio-volume" type="range" min="0" max="100" step="1" value="50" />
            <output id="audio-volume-value" for="audio-volume">50%</output>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
