<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="/style.css">
    <title>Phaser - Template</title>
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
        <aside id="orientation-notice" aria-label="Orientacja ekranu" hidden>
            <div>
                <span class="rotate-icon" aria-hidden="true">↻</span>
                <h1>Obróć telefon</h1>
                <p>MilkyWayTrader — gramy w poziomie.</p>
                <p id="orientation-help">Obróć urządzenie lub wybierz „Pełny ekran”.</p>
            </div>
        </aside>
        <div id="mobile-controls" data-game-input="ignore" hidden>
            <button id="fullscreen-toggle" type="button" aria-pressed="false">Pełny ekran</button>
            <p id="display-status" role="status" aria-live="polite"></p>
        </div>
        <div id="audio-controls" data-game-input="ignore" role="group" aria-label="Game audio">
            <button id="audio-mute" type="button" aria-pressed="false">Mute</button>
            <label for="audio-volume">Volume</label>
            <input id="audio-volume" type="range" min="0" max="100" step="1" value="50" />
            <output id="audio-volume-value" for="audio-volume">50%</output>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
