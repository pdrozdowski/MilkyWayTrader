<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="/style.css">
    <title>Phaser - Template</title>
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
        <p id="cargo-transfer-warning" role="alert" hidden></p>
        <section id="main-menu" data-game-input="ignore" aria-label="Main menu" hidden>
            <button id="main-menu-sign-in-preview" type="button"><svg class="main-menu-sign-in-preview-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5.33 0-10 2.67-10 6v2h20v-2c0-3.33-4.67-6-10-6Z" /></svg><span class="main-menu-sign-in-preview-label">Sign In</span></button>
            <div id="main-menu-controls">
                <button id="main-menu-new-game" class="action-button" type="button" aria-label="New Game"></button>
                <button id="main-menu-continue" class="action-button" type="button" aria-label="Continue Game" disabled></button>
            </div>
        </section>
        <section id="run-status" data-game-input="ignore" aria-label="Run status" hidden>
            <div id="run-status-left">
                <button id="game-menu-toggle" type="button" aria-expanded="false" aria-controls="game-menu"><img class="run-status-icon" src="/assets/icons/menu_32x32.png" alt="" aria-hidden="true" />Menu</button>
                <span id="run-status-clock"><img class="run-status-icon" data-run-status-clock-image src="/assets/icons/clock_32x32.png" alt="" aria-hidden="true" /><span data-run-status-value></span></span>
                <span id="run-status-auth" aria-live="polite"></span>
            </div>
            <div id="run-status-primary"><label id="run-status-hp-label" for="run-status-hp"><img class="run-status-icon" src="/assets/icons/heart_32x32.png" alt="" aria-hidden="true" /><span data-run-status-value></span></label><progress id="run-status-hp" value="0" max="100"></progress><section id="run-status-ship-details" aria-label="Ship information" hidden><p id="run-status-cargo-system"></p><p id="run-status-engine-system"></p><p id="run-status-weapon-system"></p><p id="run-status-booster"></p></section><section id="run-status-cargo-details" aria-label="Cargo contents" hidden><p id="run-status-cargo-contents"></p><table id="run-status-cargo-table" aria-label="Cargo stock table"><thead><tr><th scope="col">Icon</th><th scope="col">Commodity</th><th scope="col">Stock</th></tr></thead><tbody id="run-status-cargo-rows"></tbody></table></section></div>
            <div id="run-status-secondary"><span id="run-status-credits" aria-label="Credits"><img class="run-status-icon" src="/assets/icons/coins_32x32.png" alt="" aria-hidden="true" /><span data-run-status-value></span></span><span id="run-status-cargo"><img class="run-status-icon" src="/assets/icons/cargo_32x32.png" alt="" aria-hidden="true" /><span data-run-status-value></span></span><button id="run-status-ship-toggle" type="button" aria-expanded="false" aria-controls="run-status-ship-details"><img class="run-status-icon" src="/assets/icons/ship_32x32.png" alt="" aria-hidden="true" />Ship info</button><button id="run-status-cargo-toggle" type="button" aria-expanded="false" aria-controls="run-status-cargo-details"><img class="run-status-icon" src="/assets/icons/cargo2_32x32.png" alt="" aria-hidden="true" />Cargo info</button></div>
        </section>
        <section id="game-over-results" data-game-input="ignore" aria-labelledby="game-over-results-title" hidden>
            <h1 id="game-over-results-title"></h1>
            <dl>
                <div><dt id="game-over-survival-time-label"></dt><dd id="game-over-survival-time"></dd></div>
                <div><dt id="game-over-final-cash-label"></dt><dd id="game-over-final-cash"></dd></div>
            </dl>
        </section>
        <section id="game-over-status" data-game-input="ignore" aria-live="polite" aria-label="Result delivery status" hidden><p id="game-over-status-message"></p><button id="game-over-status-retry" type="button" hidden></button></section>
        <section id="game-menu" data-game-input="ignore" aria-label="Game menu" aria-modal="true" role="dialog" hidden>
            <div class="game-menu-panel">
                <button id="game-menu-close" type="button" aria-label="Close menu">X</button>
                <h2>Menu</h2>
                <div class="game-menu-actions">
                <button id="game-menu-resume" class="action-button" type="button">Resume</button>
                <div id="audio-controls" role="group" aria-label="Game audio">
                    <button id="audio-mute" type="button" aria-pressed="false">Mute</button>
                    <label for="audio-volume">Volume</label>
                    <input id="audio-volume" type="range" min="0" max="100" step="1" value="50" />
                    <output id="audio-volume-value" for="audio-volume">50%</output>
                </div>
                <div id="menu-display-controls" hidden>
                    <button id="menu-fullscreen-toggle" type="button" aria-pressed="false">Fullscreen</button>
                    <p id="menu-display-status" role="status" aria-live="polite"></p>
                </div>
                <button id="return-to-menu" class="action-button" type="button">Return to Main Menu</button>
                </div>
            </div>
        </section>
        <section id="debug-menu" data-game-input="ignore" aria-label="Debug menu" aria-modal="true" role="dialog" hidden>
            <div class="game-menu-panel debug-menu-panel">
                <button id="debug-menu-close" type="button" aria-label="Close debug menu">X</button>
                <h2>Debug</h2>
                <button id="debug-touch-controls-toggle" type="button" aria-pressed="false"></button>
                <button id="debug-mouse-movement-toggle" type="button" aria-pressed="true"></button>
                <button id="debug-booster-toggle" type="button" aria-pressed="false"></button>
                <button id="debug-teleport-seroton" type="button">Teleport to Seroton</button>
                <button id="debug-teleport-lactozis-7c" type="button">Teleport to Lactozis-7C</button>
                <button id="debug-teleport-maslo-prime" type="button">Teleport to Maslo-Prime</button>
                <button id="debug-teleport-asteroid" type="button"></button>
                <button id="debug-spawn-cargo" type="button"></button>
                <button id="debug-upgrade-cargo" type="button"></button>
                <button id="debug-upgrade-engine" type="button"></button>
                <button id="debug-upgrade-weaponary" type="button"></button>
            </div>
        </section>
        <section id="landing-status" data-game-input="ignore" aria-label="Landed status" aria-modal="true" role="dialog" hidden>
            <div class="landing-status-panel">
                <section id="landing-status-hub" class="landing-view">
                    <div class="landing-visual"><div class="landing-title-stack"><img id="landing-status-title" src="" alt="" /><img id="landing-status-landed" src="/assets/banner_landed_01.png" alt="LANDED" /></div></div>
                    <nav class="landing-actions" aria-label="Planet services"><button id="landing-status-market" class="landing-image-button" type="button" aria-label="Market"><img src="/assets/button_market.png" alt="" /></button><button id="landing-status-facilities" class="landing-image-button" type="button" aria-label="Facilities"><img src="/assets/button_facilities.png" alt="" /></button><button id="landing-status-shipyard" class="landing-image-button" type="button" aria-label="Shipyard"><img src="/assets/button_shipyard.png" alt="" /></button><button id="landing-status-launch" class="landing-image-button landing-launch" type="button" aria-label="Launch"><img src="/assets/button_launch.png" alt="" /></button></nav>
                </section>
                <section id="landing-status-market-view" class="landing-view" hidden>
                <header class="landing-facilities-header">
                    <div class="landing-facilities-nav-left"><button id="landing-status-market-back" class="action-button" type="button"></button><span id="landing-status-market-clock" class="landing-facilities-clock" role="timer"></span></div>
                    <div class="landing-facilities-nav-right"><span id="landing-status-market-credits" class="landing-resource"></span><span id="landing-status-market-cargo" class="landing-resource"></span></div>
                </header>
                <h2 id="landing-status-market-heading" class="landing-facilities-heading"></h2>
                <div id="landing-status-market-controls" class="landing-market-controls">
                <div id="landing-status-catalogue" role="group" aria-label="Seroton commodities">
                    <button type="button" data-commodity-id="milk"><span class="commodity-icon catalogue-commodity-icon" data-commodity-id="milk" aria-hidden="true"></span><span class="catalogue-commodity-name"></span></button>
                    <button type="button" data-commodity-id="grain"><span class="commodity-icon catalogue-commodity-icon" data-commodity-id="grain" aria-hidden="true"></span><span class="catalogue-commodity-name"></span></button>
                    <button type="button" data-commodity-id="cheese"><span class="commodity-icon catalogue-commodity-icon" data-commodity-id="cheese" aria-hidden="true"></span><span class="catalogue-commodity-name"></span></button>
                    <button type="button" data-commodity-id="bun"><span class="commodity-icon catalogue-commodity-icon" data-commodity-id="bun" aria-hidden="true"></span><span class="catalogue-commodity-name"></span></button>
                    <button type="button" data-commodity-id="spaceRation"><span class="commodity-icon catalogue-commodity-icon" data-commodity-id="spaceRation" aria-hidden="true"></span><span class="catalogue-commodity-name"></span></button>
                </div>
                <section id="landing-status-trade" aria-label="Trade preview">
                    <section class="market-inventory-panel" aria-label="Planet stock"><strong id="landing-status-commodity-name"></strong><p id="landing-status-planet-stock"></p><p id="landing-status-supply"></p><p id="landing-status-production"></p><p id="landing-status-consumption"></p><p id="landing-status-stock-change"></p></section>
                    <section class="market-trade-control"><header class="market-trade-header"><div><strong id="landing-status-quantity-label"></strong><p id="landing-status-unit-price"></p></div><span class="market-commodity-icon commodity-icon" role="img"></span></header><input id="landing-status-quantity" type="range" step="1" value="0" /><output id="landing-status-quantity-value" for="landing-status-quantity"></output><p id="landing-status-budget" role="status"></p><button id="landing-status-confirm" type="button"></button></section>
                    <section class="market-inventory-panel" aria-label="Ship inventory"><strong>Ship stock</strong><p id="landing-status-player-stock"></p><p id="landing-status-average-buy-price"></p><p id="landing-status-trade-income" class="market-trade-income"></p><p id="landing-status-trade-result"></p></section>
                </section>
                </div>
                </section>
                <section id="landing-status-facilities-view" class="landing-view" hidden>
                    <header class="landing-facilities-header">
                        <div class="landing-facilities-nav-left"><button id="landing-status-facilities-back" class="action-button" type="button"></button><span id="landing-status-facilities-clock" class="landing-facilities-clock" role="timer"></span></div>
                        <div class="landing-facilities-nav-right"><span id="landing-status-facilities-credits"></span><span id="landing-status-facilities-cargo"></span></div>
                    </header>
                    <h2 id="landing-status-facilities-heading" class="landing-facilities-heading"></h2>
                    <div id="landing-status-facility-cards" class="landing-facility-cards" role="group" aria-label="Planetary facilities">
                        <article class="facility-card" data-facility-id="dairyFarm">
                            <div class="facility-card-header"><span class="facility-card-icon" role="img"></span><h3 class="facility-card-name"></h3></div>
                            <p class="facility-card-level"></p>
                            <p class="facility-card-status"></p>
                            <p class="facility-card-output"></p>
                            <p class="facility-card-inputs"></p>
                            <p class="facility-card-modifier"></p>
                            <p class="facility-card-price"></p>
                            <button class="facility-card-action" type="button"></button>
                        </article>
                        <article class="facility-card" data-facility-id="grainFarm">
                            <div class="facility-card-header"><span class="facility-card-icon" role="img"></span><h3 class="facility-card-name"></h3></div>
                            <p class="facility-card-level"></p>
                            <p class="facility-card-status"></p>
                            <p class="facility-card-output"></p>
                            <p class="facility-card-inputs"></p>
                            <p class="facility-card-modifier"></p>
                            <p class="facility-card-price"></p>
                            <button class="facility-card-action" type="button"></button>
                        </article>
                        <article class="facility-card" data-facility-id="cheeseFactory">
                            <div class="facility-card-header"><span class="facility-card-icon" role="img"></span><h3 class="facility-card-name"></h3></div>
                            <p class="facility-card-level"></p>
                            <p class="facility-card-status"></p>
                            <p class="facility-card-output"></p>
                            <p class="facility-card-inputs"></p>
                            <p class="facility-card-modifier"></p>
                            <p class="facility-card-price"></p>
                            <button class="facility-card-action" type="button"></button>
                        </article>
                        <article class="facility-card" data-facility-id="bakery">
                            <div class="facility-card-header"><span class="facility-card-icon" role="img"></span><h3 class="facility-card-name"></h3></div>
                            <p class="facility-card-level"></p>
                            <p class="facility-card-status"></p>
                            <p class="facility-card-output"></p>
                            <p class="facility-card-inputs"></p>
                            <p class="facility-card-modifier"></p>
                            <p class="facility-card-price"></p>
                            <button class="facility-card-action" type="button"></button>
                        </article>
                        <article class="facility-card" data-facility-id="foodProcessor">
                            <div class="facility-card-header"><span class="facility-card-icon" role="img"></span><h3 class="facility-card-name"></h3></div>
                            <p class="facility-card-level"></p>
                            <p class="facility-card-status"></p>
                            <p class="facility-card-output"></p>
                            <p class="facility-card-inputs"></p>
                            <p class="facility-card-modifier"></p>
                            <p class="facility-card-price"></p>
                            <button class="facility-card-action" type="button"></button>
                        </article>
                    </div>
                </section>
                <section id="landing-status-shipyard-view" class="landing-view" hidden>
                    <header class="landing-facilities-header">
                        <div class="landing-facilities-nav-left"><button id="landing-status-shipyard-back" class="action-button" type="button"></button><span id="landing-status-shipyard-clock" class="landing-facilities-clock" role="timer"></span></div>
                        <div class="landing-facilities-nav-right"><span id="landing-status-shipyard-credits"></span><span id="landing-status-shipyard-cargo"></span></div>
                    </header>
                    <h2 id="landing-status-shipyard-heading" class="landing-facilities-heading"></h2>
                    <p id="landing-status-shipyard-planet" class="shipyard-planet"></p>
                    <div id="landing-status-shipyard-cards" class="shipyard-cards" role="group" aria-label="Ship services">
                        <article class="shipyard-card shipyard-repair-card">
                            <div class="shipyard-card-header"><span class="shipyard-card-icon shipyard-repair-icon" role="img"></span><h3 class="shipyard-card-name"></h3></div>
                            <p id="landing-status-shipyard-repair-hp" class="shipyard-repair-hp"></p>
                            <progress class="shipyard-repair-bar" value="0" max="100" aria-labelledby="landing-status-shipyard-repair-hp"></progress>
                            <p class="shipyard-repair-increment"></p>
                            <button id="landing-status-shipyard-repair" class="shipyard-card-action" type="button"></button>
                        </article>
                        <article class="shipyard-card" data-service-id="cargo">
                            <div class="shipyard-card-header"><span class="shipyard-card-icon" role="img"></span><h3 class="shipyard-card-name"></h3></div>
                            <p class="shipyard-card-level"></p>
                            <p class="shipyard-card-price"></p>
                            <p class="shipyard-card-availability"></p>
                            <button class="shipyard-card-action" type="button"></button>
                        </article>
                        <article class="shipyard-card" data-service-id="engine">
                            <div class="shipyard-card-header"><span class="shipyard-card-icon" role="img"></span><h3 class="shipyard-card-name"></h3></div>
                            <p class="shipyard-card-level"></p>
                            <p class="shipyard-card-price"></p>
                            <p class="shipyard-card-availability"></p>
                            <button class="shipyard-card-action" type="button"></button>
                        </article>
                        <article class="shipyard-card" data-service-id="weaponary">
                            <div class="shipyard-card-header"><span class="shipyard-card-icon" role="img"></span><h3 class="shipyard-card-name"></h3></div>
                            <p class="shipyard-card-level"></p>
                            <p class="shipyard-card-price"></p>
                            <p class="shipyard-card-availability"></p>
                            <button class="shipyard-card-action" type="button"></button>
                        </article>
                        <article class="shipyard-card shipyard-booster-card" data-booster-row>
                            <h3 class="shipyard-card-name"></h3>
                            <p class="shipyard-card-effect"></p>
                            <p class="shipyard-card-price"></p>
                            <p class="shipyard-card-availability"></p>
                            <button class="shipyard-card-action" type="button"></button>
                        </article>
                    </div>
                </section>
            </div>
        </section>
        <section id="cargo-transfer" data-game-input="ignore" aria-label="Cargo transfer" aria-modal="true" role="dialog" hidden>
            <div class="cargo-transfer-panel">
                <h2 id="cargo-transfer-title"></h2>
                <div class="cargo-transfer-grid">
                    <div class="cargo-transfer-header" role="row">
                        <span id="cargo-transfer-cargo-header"></span>
                        <span id="cargo-transfer-commodity-header"></span>
                        <span id="cargo-transfer-ship-header"></span>
                    </div>
                    <div class="cargo-transfer-usage" role="row">
                        <span id="cargo-transfer-cargo-usage"></span>
                        <span id="cargo-transfer-ship-usage"></span>
                    </div>
                    <div id="cargo-transfer-rows" role="group" aria-label="Cargo transfer commodities">
                        <section class="cargo-transfer-row" data-commodity-id="milk" hidden>
                            <span class="cargo-transfer-row-cargo-quantity"></span>
                            <div class="cargo-transfer-row-controls">
                                <button class="cargo-transfer-to-cargo-max" type="button"></button>
                                <button class="cargo-transfer-to-cargo-one" type="button"></button>
                            </div>
                            <span class="cargo-transfer-row-commodity">
                                <span class="cargo-transfer-row-icon cargo-commodity-icon commodity-icon" data-commodity-id="milk" aria-hidden="true"></span>
                                <span class="cargo-transfer-row-name"></span>
                            </span>
                            <div class="cargo-transfer-row-controls">
                                <button class="cargo-transfer-to-ship-one" type="button"></button>
                                <button class="cargo-transfer-to-ship-max" type="button"></button>
                            </div>
                            <span class="cargo-transfer-row-ship-quantity"></span>
                        </section>
                        <section class="cargo-transfer-row" data-commodity-id="grain" hidden>
                            <span class="cargo-transfer-row-cargo-quantity"></span>
                            <div class="cargo-transfer-row-controls">
                                <button class="cargo-transfer-to-cargo-max" type="button"></button>
                                <button class="cargo-transfer-to-cargo-one" type="button"></button>
                            </div>
                            <span class="cargo-transfer-row-commodity">
                                <span class="cargo-transfer-row-icon cargo-commodity-icon commodity-icon" data-commodity-id="grain" aria-hidden="true"></span>
                                <span class="cargo-transfer-row-name"></span>
                            </span>
                            <div class="cargo-transfer-row-controls">
                                <button class="cargo-transfer-to-ship-one" type="button"></button>
                                <button class="cargo-transfer-to-ship-max" type="button"></button>
                            </div>
                            <span class="cargo-transfer-row-ship-quantity"></span>
                        </section>
                        <section class="cargo-transfer-row" data-commodity-id="cheese" hidden>
                            <span class="cargo-transfer-row-cargo-quantity"></span>
                            <div class="cargo-transfer-row-controls">
                                <button class="cargo-transfer-to-cargo-max" type="button"></button>
                                <button class="cargo-transfer-to-cargo-one" type="button"></button>
                            </div>
                            <span class="cargo-transfer-row-commodity">
                                <span class="cargo-transfer-row-icon cargo-commodity-icon commodity-icon" data-commodity-id="cheese" aria-hidden="true"></span>
                                <span class="cargo-transfer-row-name"></span>
                            </span>
                            <div class="cargo-transfer-row-controls">
                                <button class="cargo-transfer-to-ship-one" type="button"></button>
                                <button class="cargo-transfer-to-ship-max" type="button"></button>
                            </div>
                            <span class="cargo-transfer-row-ship-quantity"></span>
                        </section>
                        <section class="cargo-transfer-row" data-commodity-id="bun" hidden>
                            <span class="cargo-transfer-row-cargo-quantity"></span>
                            <div class="cargo-transfer-row-controls">
                                <button class="cargo-transfer-to-cargo-max" type="button"></button>
                                <button class="cargo-transfer-to-cargo-one" type="button"></button>
                            </div>
                            <span class="cargo-transfer-row-commodity">
                                <span class="cargo-transfer-row-icon cargo-commodity-icon commodity-icon" data-commodity-id="bun" aria-hidden="true"></span>
                                <span class="cargo-transfer-row-name"></span>
                            </span>
                            <div class="cargo-transfer-row-controls">
                                <button class="cargo-transfer-to-ship-one" type="button"></button>
                                <button class="cargo-transfer-to-ship-max" type="button"></button>
                            </div>
                            <span class="cargo-transfer-row-ship-quantity"></span>
                        </section>
                        <section class="cargo-transfer-row" data-commodity-id="spaceRation" hidden>
                            <span class="cargo-transfer-row-cargo-quantity"></span>
                            <div class="cargo-transfer-row-controls">
                                <button class="cargo-transfer-to-cargo-max" type="button"></button>
                                <button class="cargo-transfer-to-cargo-one" type="button"></button>
                            </div>
                            <span class="cargo-transfer-row-commodity">
                                <span class="cargo-transfer-row-icon cargo-commodity-icon commodity-icon" data-commodity-id="spaceRation" aria-hidden="true"></span>
                                <span class="cargo-transfer-row-name"></span>
                            </span>
                            <div class="cargo-transfer-row-controls">
                                <button class="cargo-transfer-to-ship-one" type="button"></button>
                                <button class="cargo-transfer-to-ship-max" type="button"></button>
                            </div>
                            <span class="cargo-transfer-row-ship-quantity"></span>
                        </section>
                    </div>
                </div>
                <button id="cargo-transfer-close" class="cargo-transfer-confirm" type="button"></button>
            </div>
        </section>
        <aside id="orientation-notice" data-game-input="ignore" aria-label="Screen orientation" aria-modal="true" role="dialog" hidden>
            <div>
                <span class="rotate-icon" aria-hidden="true">↻</span>
                <h1>Rotate your phone</h1>
                <p id="orientation-help">To PLAY rotate your device.</p>
                <div id="mobile-controls" data-game-input="ignore">
                    <button id="fullscreen-toggle" type="button" aria-pressed="false">Fullscreen</button>
                    <p id="display-status" role="status" aria-live="polite"></p>
                </div>
            </div>
        </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
