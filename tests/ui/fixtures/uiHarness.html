<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>UI component harness</title></head>
<body>
    <main id="app"><div id="game-container"><canvas tabindex="0"></canvas></div>
        <section id="run-status" aria-label="Run status" hidden><span id="run-status-clock"></span><button id="run-status-ship-toggle" type="button" aria-expanded="false">Ship info</button><span id="run-status-credits"></span><span id="run-status-cargo"></span><label id="run-status-hp-label" for="run-status-hp"></label><progress id="run-status-hp" value="0" max="100"></progress><button id="run-status-cargo-toggle" type="button" aria-expanded="false">Cargo</button><section id="run-status-ship-details" hidden><p id="run-status-cargo-system"></p><p id="run-status-engine-system"></p><p id="run-status-weapon-system"></p><p id="run-status-booster"></p></section><section id="run-status-cargo-details" hidden><p id="run-status-cargo-contents"></p><table id="run-status-cargo-table" aria-label="Cargo stock table"><thead><tr><th scope="col">Icon</th><th scope="col">Commodity</th><th scope="col">Stock</th></tr></thead><tbody id="run-status-cargo-rows"></tbody></table></section></section>
        <div id="orientation-notice" hidden><p id="orientation-help"></p></div>
        <div id="mobile-controls" data-game-input="ignore" hidden>
            <button id="fullscreen-toggle" type="button" aria-pressed="false">Fullscreen</button>
            <p id="display-status" role="status"></p>
        </div>
        <div id="menu-display-controls" data-game-input="ignore" hidden>
            <button id="menu-fullscreen-toggle" type="button" aria-pressed="false">Fullscreen</button>
            <p id="menu-display-status" role="status"></p>
        </div>
        <div id="audio-controls" data-game-input="ignore">
            <button id="audio-mute" type="button" aria-pressed="false">Mute</button>
            <label for="audio-volume">Volume</label>
            <input id="audio-volume" type="range" min="0" max="100" value="50">
            <output id="audio-volume-value" for="audio-volume">50%</output>
        </div>
        <button id="game-menu-toggle" type="button" aria-expanded="false">Menu</button>
        <section id="game-menu" data-game-input="ignore" role="dialog" aria-modal="true" hidden><button id="game-menu-close" type="button">Close</button><button id="game-menu-resume" type="button">Resume</button><button id="return-to-menu" type="button">Exit to Main Menu</button></section>
        <section id="landing-status" data-game-input="ignore" aria-label="Landed status" aria-modal="true" role="dialog" hidden><h2 id="landing-status-title"></h2><p id="landing-status-balances"><span id="landing-status-credits"></span><span id="landing-status-cargo"></span></p><div id="landing-status-catalogue" role="group" aria-label="Seroton commodities"><button type="button" data-commodity-id="supplies"></button><button type="button" data-commodity-id="alloys"></button><button type="button" data-commodity-id="medicines"></button></div><section id="landing-status-trade" aria-label="Trade preview"><section class="market-inventory-panel" aria-label="Planet stock"><strong id="landing-status-commodity-name"></strong><p id="landing-status-planet-stock"></p><p id="landing-status-production"></p><p id="landing-status-consumption"></p><p id="landing-status-supply"></p></section><section class="market-trade-control"><header class="market-trade-header"><div><label for="landing-status-quantity" id="landing-status-quantity-label"></label><p id="landing-status-unit-price"></p></div><span class="market-commodity-icon" role="img"></span></header><input id="landing-status-quantity" type="range" step="1" value="0" /><output id="landing-status-quantity-value" for="landing-status-quantity"></output><p id="landing-status-quote"></p><p id="landing-status-budget" role="status"></p><button id="landing-status-confirm" type="button"></button></section><section class="market-inventory-panel" aria-label="Ship inventory"><p id="landing-status-player-stock"></p><p id="landing-status-average-buy-price"></p><p id="landing-status-trade-result-label"></p><p id="landing-status-trade-result"></p></section></section><button id="landing-status-launch" type="button"></button></section>
    </main>
    <script type="module" src="/tests/ui/fixtures/uiHarness.ts"></script>
</body>
</html>
