<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="/style.css"><style>#landing-status-hub { position: relative; height: 100%; }</style></head>
<body>
    <main id="app">
        <div id="game-container"><canvas tabindex="0"></canvas></div>
        <section id="run-status" aria-label="Run status"><span id="run-status-clock"></span><span id="run-status-credits"></span><span id="run-status-cargo"></span><label id="run-status-hp-label" for="run-status-hp"></label><progress id="run-status-hp"></progress><button id="run-status-ship-toggle" type="button"></button><button id="run-status-cargo-toggle" type="button"></button><section id="run-status-ship-details" hidden><p id="run-status-cargo-system"></p><p id="run-status-engine-system"></p><p id="run-status-weapon-system"></p><p id="run-status-booster"></p></section><section id="run-status-cargo-details" hidden><p id="run-status-cargo-contents"></p><table id="run-status-cargo-table" aria-label="Cargo stock table"><thead><tr><th scope="col">Icon</th><th scope="col">Commodity</th><th scope="col">Stock</th></tr></thead><tbody id="run-status-cargo-rows"></tbody></table></section></section>
        <section id="landing-status" data-game-input="ignore" aria-label="Landed status" aria-modal="true" role="dialog" hidden><div class="landing-status-panel"><section id="landing-status-hub"><div class="landing-visual"><div class="landing-title-stack"><img id="landing-status-title" src="" alt="" /><img id="landing-status-landed" src="/assets/banner_landed_01.png" alt="LANDED" /></div></div><nav class="landing-actions" aria-label="Planet services"><button id="landing-status-market" class="landing-image-button" type="button" aria-label="Market"><img src="/assets/button_market.png" alt="" /></button><button id="landing-status-shipyard" class="landing-image-button" type="button" aria-label="Shipyard unavailable" disabled><img src="/assets/button_shipyard.png" alt="" /></button><button id="landing-status-launch" class="landing-image-button landing-launch" type="button" aria-label="Launch"><img src="/assets/button_launch.png" alt="" /></button></nav></section><section id="landing-status-market-view" hidden><h2 id="landing-status-market-heading"></h2><p id="landing-status-balances"><span id="landing-status-credits"></span><span id="landing-status-cargo"></span></p><div id="landing-status-catalogue" role="group" aria-label="Planet commodities"><button type="button" data-commodity-id="supplies"></button><button type="button" data-commodity-id="alloys"></button><button type="button" data-commodity-id="medicines"></button></div><section id="landing-status-trade" aria-label="Trade preview"><section aria-label="Planet stock"><strong id="landing-status-commodity-name"></strong><p id="landing-status-planet-stock"></p><p id="landing-status-production"></p><p id="landing-status-consumption"></p><p id="landing-status-supply"></p></section><section><header class="market-trade-header"><div><label for="landing-status-quantity" id="landing-status-quantity-label"></label><p id="landing-status-unit-price"></p></div><span class="market-commodity-icon" role="img"></span></header><input id="landing-status-quantity" type="range" step="1" value="0" /><output id="landing-status-quantity-value" for="landing-status-quantity"></output><p id="landing-status-quote"></p><p id="landing-status-budget" role="status"></p><button id="landing-status-confirm" type="button"></button></section><section aria-label="Ship inventory"><p id="landing-status-player-stock"></p><p id="landing-status-average-buy-price"></p><p id="landing-status-trade-result-label"></p><p id="landing-status-trade-result"></p></section></section><button id="landing-status-back" type="button"></button></section></div></section>
    </main>
    <script type="module" src="/tests/ui/fixtures/landedMarketApplicationHarness.ts"></script>
</body>
</html>
